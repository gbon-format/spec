name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: repository gate
        run: bash scripts/gate.sh
      - name: gate self-test
        run: bash scripts/gate.sh --self-test
